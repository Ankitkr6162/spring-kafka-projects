spring.application.name=spring-kafka-consumer-app

server.port=8082

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=kafka-object-topic-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Deserialize both String and Customer messages using JSON type headers
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Map the producer's customer identifier to the consumer's DTO package
spring.kafka.consumer.properties[spring.json.type.mapping]=customer:com.kafka.consumer.dto.Customer

spring.kafka.consumer.properties[spring.json.trusted.packages]=com.kafka.consumer.dto,java.lang,java.util

spring.kafka.consumer.auto-offset-reset=earliest

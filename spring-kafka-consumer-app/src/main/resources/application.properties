spring.application.name=spring-kafka-consumer-app
server.port=9292

# ==========================================
# 1. Kafka Consumer Configuration
# ==========================================
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=jt-group
spring.kafka.consumer.auto-offset-reset=earliest

# Key & Value Deserializers (Wrapped with ErrorHandlingDeserializer)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Trust both Consumer and Producer DTO packages
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kafka.consumer.dto,com.springboot.kafka.dto

# Fallback default type if a message has no __TypeId__ header
spring.kafka.consumer.properties.spring.json.value.default.type=com.kafka.consumer.dto.User

# Map Producer DTO class names to Consumer DTO class names
spring.kafka.consumer.properties.spring.json.type.mapping=com.springboot.kafka.dto.User:com.kafka.consumer.dto.User,com.springboot.kafka.dto.Customer:com.kafka.consumer.dto.Customer

# ==========================================
# 2. Kafka Producer Configuration (Required for @RetryableTopic & DLT)
# ==========================================
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
